# The two-colour button tiles in `QLC+ Setups/Colores/`, one per pair.
# Each tile is split on the diagonal from bottom-left to top-right: the
# first colour fills the top-left half, the second the bottom-right half.
# Colours were read from the fills of the old `Colores/Colors.psd`
# (2024-08-31), which this file and `write_tiles.py` replace.
# `Rosa-Cyan` was exported on its own, outside the PSD, with its own pink.
# `Arcoiris.png` is a drawn picture, not a pair, and is kept as it is.

